name: PR13 bounded plan-state rework

on:
  push:
    branches:
      - ux/hms-reports-admin
    paths:
      - .github/workflows/pr13-network-plan-rework.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/hms-reports-admin
          fetch-depth: 0
      - name: Apply exact one-site repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          old = 'async function updatePlan(plan_tier: string) { if (!selected) return; setError(""); try { await api(`/hotels/${selected.id}/plan`, { method: "PATCH", body: JSON.stringify({ plan_tier }) }); setMessage("Plan updated"); await load(); await loadKpis(); } catch (e) { setError((e as Error).message); } }'
          new = 'async function updatePlan(plan_tier: string) { if (!selected) return; const authoritative = hotels.find(h => h.id === selected.id) ?? selected; setError(""); setMessage(""); try { await api(`/hotels/${selected.id}/plan`, { method: "PATCH", body: JSON.stringify({ plan_tier }) }); setMessage("Plan updated"); await load(); await loadKpis(); } catch (e) { setSelected(authoritative); setError((e as Error).message); } }'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one updatePlan target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hms-method-bot"
          git config user.email "34699048+sjo1848@users.noreply.github.com"
          git add apps/web/src/App.tsx
          git diff --cached --check
          git commit -m "fix(ux): restore authoritative plan after rejection"
          git push origin HEAD:ux/hms-reports-admin
