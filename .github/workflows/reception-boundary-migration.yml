name: reception-boundary-migration

on:
  push:
    branches:
      - "refactor/web-architecture-hardening"
    paths:
      - ".github/workflows/reception-boundary-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/web-architecture-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/split-reception-billing.mjs
      - name: Commit bounded split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/reception/ReceptionPage.tsx
          if git diff --cached --quiet; then
            echo "No split changes"
            exit 0
          fi
          git commit -m "refactor(web): split reception from billing"
          git push origin HEAD:refactor/web-architecture-hardening
