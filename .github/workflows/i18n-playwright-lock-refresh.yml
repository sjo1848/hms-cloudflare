name: Temporary Playwright lock refresh

on:
  push:
    branches:
      - feature/i18n-es-ar
    paths:
      - package.json

permissions:
  contents: write

concurrency:
  group: hms-i18n-playwright-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only
      - name: Commit lockfile drift
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh lockfile for Playwright 1.56"
          git push origin HEAD:feature/i18n-es-ar
