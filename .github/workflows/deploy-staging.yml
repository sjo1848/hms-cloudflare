name: Deploy HMS staging

on:
  workflow_dispatch:
  push:
    branches:
      - acceptance/staging

permissions:
  contents: read

concurrency:
  group: hms-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
      CF_ACCESS_AUDIENCE: ${{ vars.CF_ACCESS_AUDIENCE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials and D1 access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler whoami
          if ! npx wrangler d1 list --json >/dev/null; then
            echo "Cloudflare token is valid but lacks D1 access. Add Account > D1 > Write/Edit to the token and retry." >&2
            exit 1
          fi

      - name: Create or reuse staging D1 databases
        shell: bash
        run: |
          set -euo pipefail
          ensure_db() {
            local name="$1" rows id
            if ! rows="$(npx wrangler d1 list --json)"; then
              echo "Unable to list D1 databases for $name." >&2
              return 1
            fi
            id="$(printf '%s' "$rows" | node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync(0,"utf8")); const row=rows.find(x=>x.name===process.argv[1]); if(row) process.stdout.write(row.uuid||row.id||"");' "$name")"
            if [[ -z "$id" ]]; then
              if ! npx wrangler d1 create "$name" >&2; then
                echo "Unable to create D1 database $name. Token requires Account > D1 > Write/Edit." >&2
                return 1
              fi
              if ! rows="$(npx wrangler d1 list --json)"; then
                return 1
              fi
              id="$(printf '%s' "$rows" | node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync(0,"utf8")); const row=rows.find(x=>x.name===process.argv[1]); if(!row) process.exit(2); process.stdout.write(row.uuid||row.id||"");' "$name")"
            fi
            [[ -n "$id" ]] || { echo "D1 database id missing for $name" >&2; return 1; }
            printf '%s' "$id"
          }

          CONTROL_DB_ID="$(ensure_db hms-control-staging)"
          HOTEL_DEMO_DB_ID="$(ensure_db hms-hotel-demo-staging)"
          HOTEL_SECOND_DB_ID="$(ensure_db hms-hotel-second-staging)"
          {
            echo "CONTROL_DB_ID=$CONTROL_DB_ID"
            echo "HOTEL_DEMO_DB_ID=$HOTEL_DEMO_DB_ID"
            echo "HOTEL_SECOND_DB_ID=$HOTEL_SECOND_DB_ID"
          } >> "$GITHUB_ENV"

      - name: Render account-specific API configuration
        run: node scripts/cloudflare/render-staging-config.mjs

      - name: Apply remote D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          config=apps/api/wrangler.staging.generated.jsonc
          npx wrangler d1 migrations apply CONTROL_DB --remote --config "$config"
          npx wrangler d1 migrations apply HOTEL_DEMO_DB --remote --config "$config"
          npx wrangler d1 migrations apply HOTEL_SECOND_DB --remote --config "$config"

      - name: Seed pristine staging data once
        shell: bash
        run: |
          set -euo pipefail
          config=apps/api/wrangler.staging.generated.jsonc
          count_rehearsals() {
            local binding="$1" payload
            payload="$(npx wrangler d1 execute "$binding" --remote --config "$config" --command "SELECT COUNT(*) AS count FROM migration_rehearsals" --json)"
            printf '%s' "$payload" | node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(0,"utf8")); const n=Number(p?.[0]?.results?.[0]?.count ?? -1); if(!Number.isInteger(n)||n<0) process.exit(2); process.stdout.write(String(n));'
          }

          control="$(count_rehearsals CONTROL_DB)"
          hotel_a="$(count_rehearsals HOTEL_DEMO_DB)"
          hotel_b="$(count_rehearsals HOTEL_SECOND_DB)"

          if [[ "$control" == 0 && "$hotel_a" == 0 && "$hotel_b" == 0 ]]; then
            node scripts/cloudflare/render-staging-seed.mjs .staging-seed
            npx wrangler d1 execute CONTROL_DB --remote --config "$config" --file .staging-seed/CONTROL_DB.sql --yes
            npx wrangler d1 execute HOTEL_DEMO_DB --remote --config "$config" --file .staging-seed/HOTEL_DEMO_DB.sql --yes
            npx wrangler d1 execute HOTEL_SECOND_DB --remote --config "$config" --file .staging-seed/HOTEL_SECOND_DB.sql --yes
          elif [[ "$control" -ge 1 && "$hotel_a" -ge 1 && "$hotel_b" -ge 1 ]]; then
            echo "Staging fixture already initialized; preserving remote test state."
          else
            echo "Refusing deploy: staging D1 seed state is partial ($control/$hotel_a/$hotel_b)." >&2
            exit 1
          fi

      - name: Validate and deploy API Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config apps/api/wrangler.staging.generated.jsonc
          npx wrangler deploy --config apps/api/wrangler.staging.generated.jsonc

      - name: Build web application
        run: npm run web:build

      - name: Validate and deploy web Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config apps/web/wrangler.staging.jsonc
          npx wrangler deploy --config apps/web/wrangler.staging.jsonc

      - name: Staging handoff
        run: |
          echo "Staging deploy complete."
          if [[ -z "${CF_ACCESS_TEAM_DOMAIN:-}" || -z "${CF_ACCESS_AUDIENCE:-}" ]]; then
            echo "Cloudflare Access is still pending. Protect hms-cloudflare-web-staging and then set CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUDIENCE repository variables before the authenticated acceptance run."
          fi
