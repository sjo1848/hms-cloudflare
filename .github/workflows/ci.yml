name: foundation-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run types:check
      - run: npm run check
      - run: npm run web:build
      - name: Validate architecture fitness and Cloudflare budgets
        run: npm run architecture:fitness
      - name: Validate D1 critical query plans
        run: npm run test:d1-query-plan
      - run: npm run wrangler:dry-run
      - name: Validate staging Web Worker SPA config
        run: npx wrangler deploy --dry-run -c apps/web/wrangler.staging.jsonc
