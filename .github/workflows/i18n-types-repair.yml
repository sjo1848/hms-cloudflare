name: Temporary i18n types repair

on:
  push:
    branches:
      - feature/i18n-es-ar

permissions:
  contents: write

concurrency:
  group: hms-i18n-types-repair
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate Wrangler types only
        run: |
          npm run types:api
          npm run types:web
      - name: Commit generated type drift if present
        shell: bash
        run: |
          set -euo pipefail
          git add apps/api/worker-configuration.d.ts apps/web/worker-configuration.d.ts
          if git diff --cached --quiet; then
            echo "No generated type drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Wrangler generated types"
          git push origin HEAD:feature/i18n-es-ar
