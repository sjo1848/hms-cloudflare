name: Regenerate Agent HMS Worker types

on:
  push:
    branches:
      - feature/agent-hms-service-readonly
    paths:
      - .github/workflows/regen-agent-hms-types.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-hms-service-readonly
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run types:api
      - name: Commit regenerated type file
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/api/worker-configuration.d.ts; then
            echo "No generated type changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/worker-configuration.d.ts
          git commit -m "chore(hms): regenerate Worker types for AgentHmsService"
          git push origin HEAD:feature/agent-hms-service-readonly
